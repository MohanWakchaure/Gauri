<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy birthday, Gauri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #1e0b2b;
  --wine: #4a1646;
  --rose: #e8658a;
  --blush: #ffc9d6;
  --peach: #ffb59e;
  --ivory: #fff3ee;
  --script: 'Parisienne', 'Snell Roundhand', cursive;
  --body: 'Lora', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; color: var(--ivory); font-family: var(--body); line-height: 1.7;
  background: linear-gradient(180deg, #1e0b2b 0%, #4a1646 38%, #8a2f64 72%, #c9577b 100%) fixed, #4a1646;
  overflow-x: hidden; -webkit-text-size-adjust: 100%;
}
body.locked { overflow: hidden; }
:focus-visible { outline: 2px solid var(--peach); outline-offset: 3px; }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
main { position: relative; z-index: 1; }

/* Envelope gate */
#gate {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem;
  background: linear-gradient(180deg, #1e0b2b, #4a1646 60%, #8a2f64); transition: opacity 1s ease;
}
#gate.gone { opacity: 0; pointer-events: none; }
.gate-hint { margin: 0; font-family: var(--script); font-size: clamp(2rem, 8vw, 2.8rem); text-align: center; padding: 0 1.5rem; }
.env { position: relative; width: min(86vw, 360px); aspect-ratio: 3 / 2; perspective: 900px; }
.env > * { position: absolute; }
.env-back { inset: 0; background: #7d2a55; border-radius: 6px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); }
.paper {
  left: 6%; right: 6%; top: 8%; bottom: 6%; background: var(--ivory); border-radius: 4px;
  transition: transform 0.9s ease 0.7s; display: flex; align-items: center; justify-content: center;
  font-family: var(--script); color: #7d2a55; font-size: clamp(1.6rem, 6vw, 2.2rem);
}
.env-front { inset: 0; background: #a23a65; clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
.flap {
  left: 0; right: 0; top: 0; height: 58%; background: #c04f78; transform-origin: top center;
  clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 3; transition: transform 0.9s ease, z-index 0s 0.45s;
}
.seal {
  left: 50%; top: 55%; width: 58px; height: 58px; margin: -29px 0 0 -29px; z-index: 4; border: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff6b8e, #b31f48 70%); color: var(--ivory); font-size: 1.6rem; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); animation: pulse 2s ease-in-out infinite; transition: opacity 0.4s;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.env.open .flap { transform: rotateX(180deg); z-index: 0; }
.env.open .paper { transform: translateY(-55%); }
.env.open .seal { opacity: 0; pointer-events: none; animation: none; }

/* Hero */
.hero { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 1.5rem 8vh; text-align: center; gap: 2rem; }
.arch-wrap { perspective: 900px; }
.arch {
  width: min(66vw, 290px); aspect-ratio: 3 / 4; border-radius: 999px 999px 18px 18px; overflow: hidden;
  border: 2px solid var(--blush); box-shadow: 0 0 60px rgba(255, 150, 180, 0.45), 0 30px 60px rgba(0, 0, 0, 0.4);
  transform-style: preserve-3d; will-change: transform; opacity: 0; transition: opacity 1.6s ease 0.4s;
}
body.opened .arch { opacity: 1; }
.arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.hero h1 { margin: 0; font-family: var(--script); font-weight: 400; line-height: 1.05; text-shadow: 0 0 30px rgba(255, 140, 170, 0.5); }
.hero h1 span { display: block; clip-path: inset(-15% 100% -15% -5%); }
.hero .l1 { font-size: clamp(2.6rem, 11vw, 4.2rem); }
.hero .l2 { font-size: clamp(4rem, 19vw, 7rem); }
body.opened .l1 { animation: write 2.2s ease-in-out 0.8s forwards; }
body.opened .l2 { animation: write 2s ease-in-out 2.8s forwards; }
@keyframes write { to { clip-path: inset(-15% -5% -15% -5%); } }
.scroll-hint { font-size: 0.95rem; color: var(--blush); opacity: 0; transition: opacity 1.5s ease 5s; }
body.opened .scroll-hint { opacity: 0.8; }

/* Sections */
.panel { max-width: 36rem; margin: 0 auto; padding: 12vh 1.5rem; }
.panel h2 { margin: 0 0 1.4rem; font-family: var(--script); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.1; text-align: center; }
.letter-card {
  background: rgba(255, 243, 238, 0.07); border: 1px solid rgba(255, 201, 214, 0.35); border-radius: 18px;
  padding: 2rem 1.6rem; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.letter-card p { margin: 0 0 1.2rem; font-style: italic; font-size: clamp(1.1rem, 4vw, 1.25rem); line-height: 1.85; }
.letter-card p:last-child { margin-bottom: 0; }

/* Scroll-tilting polaroids */
.scrap { padding: 4vh 0 8vh; }
.scrap > h2 { margin: 0 0 3vh; padding: 0 1.5rem; font-family: var(--script); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.4rem); text-align: center; }
.card {
  width: min(78vw, 320px); margin: 9vh auto; padding: 12px 12px 62px; background: var(--ivory); color: #5a1a4a; position: relative;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45); will-change: transform; border-radius: 3px;
}
.card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 22%; display: block; }
.card figcaption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-family: var(--script); font-size: 1.8rem; line-height: 1.2; padding: 0 0.6rem; }

/* Hearts */
.hearts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; max-width: 18rem; margin: 0 auto; justify-items: center; }
.heart-btn { width: 64px; height: 64px; padding: 0; background: none; border: 0; cursor: pointer; }
.heart-btn svg { width: 100%; height: 100%; fill: rgba(255, 201, 214, 0.28); stroke: var(--blush); stroke-width: 1.2; transition: fill 0.4s, transform 0.3s, filter 0.4s; }
.heart-btn:active svg { transform: scale(0.9); }
.heart-btn.lit svg { fill: var(--rose); filter: drop-shadow(0 0 10px rgba(255, 110, 150, 0.9)); }
.heart-btn.active svg { transform: scale(1.18); }
#reason { min-height: 7.5rem; margin: 1.6rem 0 0; text-align: center; font-style: italic; font-size: clamp(1.2rem, 4.6vw, 1.45rem); line-height: 1.6; }
.hint { margin: 0 0 1.4rem; text-align: center; color: var(--blush); font-size: 0.95rem; }

/* Finale */
.finale { text-align: center; padding-bottom: 22vh; }
.btn {
  appearance: none; cursor: pointer; font-family: var(--body); font-size: 1.05rem; color: var(--ivory);
  background: rgba(255, 243, 238, 0.1); border: 1px solid var(--blush); padding: 0.9rem 2.2rem; min-height: 48px; border-radius: 999px;
  transition: background 0.3s, transform 0.2s;
}
.btn:hover { background: rgba(232, 101, 138, 0.35); }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.75; cursor: default; }
.finale-text { opacity: 0; transition: opacity 1.8s ease 0.9s; margin-top: 2.4rem; }
.finale.done .finale-text { opacity: 1; }
.finale-text p { font-style: italic; font-size: clamp(1.15rem, 4.2vw, 1.3rem); line-height: 1.85; margin: 0 0 1.2rem; }
.finale-text .sign { font-family: var(--script); font-style: normal; font-size: 2.4rem; line-height: 1.2; }

@media (prefers-reduced-motion: reduce) {
  .arch, .scroll-hint, .finale-text, #gate { transition-duration: 0.01s; transition-delay: 0s; }
  body.opened .l1, body.opened .l2 { animation-duration: 0.01s; animation-delay: 0s; }
  .seal { animation: none; }
}
</style>
</head>
<body class="locked">
<canvas id="petals" aria-hidden="true"></canvas>

<div id="gate">
  <div class="env" id="env">
    <div class="env-back"></div>
    <div class="paper" id="paper"></div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <button class="seal" id="open" type="button" aria-label="Open the letter">&#9829;</button>
  </div>
  <p class="gate-hint">A letter for <span id="gate-name"></span></p>
</div>

<main>
  <section class="hero">
    <div class="arch-wrap"><div class="arch" id="arch"><img id="hero-img" alt=""></div></div>
    <h1><span class="l1">Happy Birthday</span><span class="l2" id="hero-name"></span></h1>
    <div class="scroll-hint">Scroll down</div>
  </section>

  <section class="panel">
    <h2 id="letter-title"></h2>
    <div class="letter-card" id="letter"></div>
  </section>

  <section class="scrap" id="scrap">
    <h2>A few of my favourites</h2>
  </section>

  <section class="panel">
    <h2>Wishes for you</h2>
    <p class="hint">Touch a heart</p>
    <div class="hearts" id="hearts"></div>
    <p id="reason" aria-live="polite"></p>
  </section>

  <section class="panel finale" id="finale">
    <h2>One last thing</h2>
    <button class="btn" id="wish-btn" type="button">Make a wish</button>
    <div class="finale-text">
      <p id="wish-line"></p>
      <p class="sign" id="sign"></p>
    </div>
  </section>
</main>

  var $ = function (s) { return document.querySelector(s); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  document.title = 'Happy birthday, ' + CONFIG.name;
  $('#gate-name').textContent = CONFIG.name;
  $('#paper').textContent = 'Happy Birthday';
  $('#hero-name').textContent = CONFIG.name;
  $('#letter-title').textContent = CONFIG.letterTitle;
  $('#wish-line').textContent = CONFIG.wishLine;
  $('#sign').textContent = 'With love, ' + CONFIG.from;
  var heroImg = $('#hero-img'); heroImg.src = CONFIG.photos[0].src; heroImg.alt = CONFIG.name;
  CONFIG.letter.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; $('#letter').appendChild(p); });

  /* Polaroids */
  var cards = CONFIG.photos.slice(1).map(function (ph, i) {
    var fig = document.createElement('figure'); fig.className = 'card'; fig.style.margin = '';
    var img = document.createElement('img'); img.src = ph.src; img.alt = ph.caption || ''; img.loading = 'lazy';
    var cap = document.createElement('figcaption'); cap.textContent = ph.caption || '';
    fig.appendChild(img); fig.appendChild(cap); $('#scrap').appendChild(fig);
    return { el: fig, r: (i % 2 ? 3 : -3) };
  });

  /* Hearts */
  var heartsEl = $('#hearts'), reasonEl = $('#reason');
  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.9 4.5 6.6 4.5c2 0 3.6 1 5.4 3 1.8-2 3.4-3 5.4-3 3.7 0 5.8 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  CONFIG.reasons.forEach(function (text, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'heart-btn'; b.innerHTML = HEART;
    b.setAttribute('aria-label', 'Wish ' + (i + 1));
    b.addEventListener('click', function () {
      heartsEl.querySelectorAll('.active').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active', 'lit'); reasonEl.textContent = text;
      var r = b.getBoundingClientRect(); spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 16);
    });
    heartsEl.appendChild(b);
  });

  /* Petals */
  var cv = $('#petals'), ctx = cv.getContext('2d'), W = 0, H = 0, dpr = 1;
  var COLORS = ['#ff9db5', '#ffc9d6', '#e8658a', '#ffb59e', '#ff7aa2'];
  var petals = [], running = false;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function newPetal(ambient, x, y) {
    var s = 6 + Math.random() * 8;
    var p = { x: x, y: y, s: s, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 1.6, flip: Math.random() * 6.28, vf: 1 + Math.random() * 2,
      c: COLORS[Math.floor(Math.random() * COLORS.length)], a: 0.9, amb: ambient, phase: Math.random() * 6.28 };
    if (ambient) { p.vx = 0; p.vy = 22 + Math.random() * 30; }
    else { var th = Math.random() * 6.28, sp = 60 + Math.random() * 240; p.vx = Math.cos(th) * sp; p.vy = Math.sin(th) * sp - 80; p.life = 3.6 + Math.random(); p.age = 0; }
    return p;
  }
  function seedAmbient() {
    var n = reduce ? 8 : Math.min(30, Math.floor(W / 14));
    for (var i = 0; i < n; i++) petals.push(newPetal(true, Math.random() * W, Math.random() * H));
  }
  function spawnBurst(x, y, n) { for (var i = 0; i < n; i++) petals.push(newPetal(false, x, y)); if (!running) start(); }
  function drawPetal(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.scale(Math.abs(Math.cos(p.flip)) * 0.8 + 0.2, 1); ctx.globalAlpha = p.a;
    var s = p.s; ctx.beginPath(); ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.8, s * 0.7, 0, s);
    ctx.bezierCurveTo(-s * 0.8, s * 0.7, -s * 0.9, -s * 0.6, 0, -s);
    ctx.fillStyle = p.c; ctx.fill(); ctx.restore();
  }
  var lastT = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    ctx.clearRect(0, 0, W, H);
    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i];
      if (p.amb) {
        p.phase += dt; p.x += Math.sin(p.phase * 1.2) * 18 * dt + 6 * dt; p.y += p.vy * dt;
        if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
        if (p.x > W + 20) p.x = -20;
      } else {
        p.age += dt; p.vy += 120 * dt; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt;
        p.a = clamp(1 - p.age / p.life, 0, 0.9);
        if (p.age > p.life || p.y > H + 30) { petals.splice(i, 1); continue; }
      }
      p.rot += p.vr * dt; p.flip += p.vf * dt; drawPetal(p);
    }
  }
  function start() { if (running) return; running = true; lastT = performance.now(); requestAnimationFrame(tick); }
  size(); window.addEventListener('resize', size);

  /* Gate */
  var gate = $('#gate'), env = $('#env');
  $('#open').addEventListener('click', function () {
    env.classList.add('open');
    setTimeout(function () {
      document.body.classList.remove('locked'); document.body.classList.add('opened'); gate.classList.add('gone');
      seedAmbient(); start();
      setTimeout(function () { gate.hidden = true; }, 1100);
    }, 1900);
  });

  /* Wish */
  var wished = false;
  $('#wish-btn').addEventListener('click', function () {
    if (wished) return; wished = true; this.textContent = 'Wish made'; this.disabled = true;
    $('#finale').classList.add('done');
    spawnBurst(W / 2, H * 0.55, 140); setTimeout(function () { spawnBurst(W * 0.25, H * 0.5, 70); }, 350); setTimeout(function () { spawnBurst(W * 0.75, H * 0.5, 70); }, 600);
  });

  /* Pointer tilt for portrait, scroll tilt for polaroids */
  var arch = $('#arch'), tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener('pointermove', function (e) {
    tx = (e.clientX / window.innerWidth - 0.5) * 2; ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  function loop() {
    requestAnimationFrame(loop);
    if (!reduce) {
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
      var t = performance.now() / 1000;
      arch.style.transform = 'translateY(' + (Math.sin(t * 0.9) * 6) + 'px) rotateY(' + (cx * 10) + 'deg) rotateX(' + (-cy * 8) + 'deg)';
    }
    var vh = window.innerHeight;
    cards.forEach(function (c) {
      var r = c.el.getBoundingClientRect();
      var d = clamp(((r.top + r.height / 2) - vh / 2) / vh, -1, 1);
      c.el.style.transform = 'perspective(900px) rotateX(' + (reduce ? 0 : -d * 16) + 'deg) rotateZ(' + c.r + 'deg) scale(' + (1 - Math.abs(d) * 0.05) + ')';
    });
  }
  loop();
})();
